<section id="credentials" class="credentials" aria-labelledby="credentials-title">
  <div class="section-inner">
    <div class="credentials-heading">
      <p class="eyebrow">Peace of mind</p>
      <h2 id="credentials-title" class="credentials-title">
        Licensed. Insured. <em>Accountable.</em>
      </h2>
    </div>

    <ul class="credentials-grid">
      @for (credential of credentials; track credential.id) {
        <li class="credential">
          <span class="credential-icon"><i class="bi {{ credential.icon }}"></i></span>
          <div class="credential-text">
            <h3 class="credential-title">{{ credential.title }}</h3>
            <p class="credential-detail">{{ credential.detail }}</p>
          </div>
        </li>
      }
    </ul>
  </div>
</section>
