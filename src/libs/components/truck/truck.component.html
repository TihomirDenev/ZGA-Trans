<svg class="truck" viewBox="0 0 820 220" role="img" aria-label="ZGA Trans truck">
  <defs>
    <linearGradient id="truck-trailer-paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1838" />
      <stop offset="1" stop-color="#060a1a" />
    </linearGradient>
    <linearGradient id="truck-cab-paint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2d6b" />
      <stop offset="1" stop-color="#070c22" />
    </linearGradient>
    <linearGradient id="truck-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9cc2ff" stop-opacity="0.75" />
      <stop offset="1" stop-color="#1a2d6b" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="truck-rim" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#f4f7ff" />
      <stop offset="0.6" stop-color="#8f9ab3" />
      <stop offset="1" stop-color="#3b4359" />
    </radialGradient>
    <linearGradient id="truck-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6efff" stop-opacity="0.7" />
      <stop offset="1" stop-color="#e6efff" stop-opacity="0" />
    </linearGradient>
    <filter id="truck-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="truck-soft-blur">
      <feGaussianBlur stdDeviation="10" />
    </filter>
  </defs>

  <!-- Blue under-glow on the road -->
  <ellipse
    class="truck-underglow"
    cx="410"
    cy="204"
    rx="410"
    ry="12"
    filter="url(#truck-soft-blur)"
  />

  <!-- Headlight beam -->
  <path class="truck-beam" d="M790 130 L1180 92 L1180 214 Z" />

  <g class="truck-body">
    <!-- ─── Trailer ─────────────────────────────────────────────── -->
    <rect class="trailer-chassis" x="40" y="148" width="564" height="12" rx="2" />
    <rect class="trailer-leg" x="520" y="158" width="6" height="26" />
    <rect class="trailer-box" x="10" y="32" width="594" height="118" rx="6" />

    <g class="trailer-lightning" filter="url(#truck-glow)">
      <path d="M60 32 L84 64 L70 70 L98 112 L86 118 L110 150" />
      <path d="M250 32 L262 50 L254 54 L266 72" />
      <path d="M420 32 L404 58 L420 64 L396 98" />
      <path d="M570 150 L554 120 L568 114 L546 84" />
      <path d="M520 32 L532 46 L524 50 L538 66" />
    </g>

    <text class="trailer-slogan" x="307" y="70" text-anchor="middle">Straight to your goals.</text>
    <text class="trailer-brand" x="307" y="118" text-anchor="middle">ZGA TRANS</text>

    @for (lightX of trailerLightPositionsX; track lightX) {
      <circle class="truck-marker-light" [attr.cx]="lightX" cy="38" r="2.4" />
      <circle class="truck-marker-light" [attr.cx]="lightX" cy="144" r="2.4" />
    }

    <rect class="truck-tail-light" x="8" y="126" width="5" height="16" rx="1.5" />

    <!-- ─── Cab ─────────────────────────────────────────────────── -->
    <g transform="translate(150 0)">
      <path
        class="cab-shell"
        d="M462 168 L462 44 Q462 24 482 22 L596 18 Q610 18 614 32 L632 96 L644 104 L644 160 Q644 168 636 168 Z"
      />
      <path class="cab-door-line" d="M490 48 L490 160 M582 48 L590 160" />
      <path class="cab-window" d="M496 50 H576 Q582 50 584 56 L598 96 H496 Z" />
      <path class="cab-windscreen" d="M604 30 L614 30 L634 98 L622 100 Z" />
      <rect class="cab-mirror" x="606" y="44" width="5" height="34" rx="2" />

      <g class="cab-lightning" filter="url(#truck-glow)">
        <path d="M470 110 L500 126 L490 132 L524 150" />
        <path d="M612 104 L596 124 L606 128 L590 150" />
      </g>

      @for (lightX of cabRoofLightPositionsX; track lightX) {
        <circle class="truck-marker-light" [attr.cx]="lightX" cy="27" r="2" />
      }

      <rect class="cab-fuel-tank" x="526" y="140" width="46" height="24" rx="6" />
      <rect class="cab-bumper" x="620" y="148" width="30" height="22" rx="4" />
      <rect class="cab-headlight" x="628" y="124" width="18" height="12" rx="3" />
      <path class="cab-led-strip" d="M468 164 H520 M576 164 H620" />
    </g>

    <!-- Wheel arches -->
    @for (wheelX of wheelPositionsX; track wheelX) {
      <circle class="wheel-arch" [attr.cx]="wheelX" cy="176" r="30" />
    }
  </g>

  <!-- ─── Wheels (rotated by the journey section) ───────────────── -->
  @for (wheelX of wheelPositionsX; track wheelX) {
    <g [attr.transform]="'translate(' + wheelX + ' 176)'">
      <g class="truck-wheel">
        <circle class="wheel-tyre" r="25" />
        <circle class="wheel-tread" r="22.5" />
        <circle class="wheel-rim" r="15" />
        <circle class="wheel-rim-glow" r="15.5" />
        @for (spokeAngle of wheelSpokeAngles; track spokeAngle) {
          <line
            class="wheel-spoke"
            x1="0"
            y1="4"
            x2="0"
            y2="13"
            [attr.transform]="'rotate(' + spokeAngle + ')'"
          />
        }
        <circle class="wheel-hub" r="4.5" />
      </g>
    </g>
  }
</svg>
