<section class="not-found">
  <div class="not-found-sign" aria-hidden="true">
    <span class="not-found-sign-board">
      <i class="bi bi-sign-dead-end-fill"></i>
    </span>
    <span class="not-found-sign-post"></span>
  </div>

  <p class="not-found-code" aria-hidden="true">404</p>
  <h1 class="not-found-title">Wrong <em>turn.</em></h1>
  <p class="not-found-text">This road doesn’t lead anywhere. Let’s get you back on the motorway.</p>

  <a class="button button-primary" [routerLink]="homePath">
    Back on the road <i class="bi bi-arrow-right"></i>
  </a>

  <div class="not-found-road" aria-hidden="true"></div>
</section>
